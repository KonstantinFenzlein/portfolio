<section class="about-section">
  <img src="images/bg-circle.png" class="blob blob-1" alt="Größere Ellipse" />
  <img src="images/bg-circle.png" class="blob blob-2" alt="Kleinere Ellipse" />

  <div class="content-container">
    <div class="left-column">
      <h2 [innerHTML]="i18n.translate('about.title')"></h2>

      <div class="i-am-section">
        <h3>{{ i18n.translate('about.iAm') }}</h3>

        <div class="icons-list">
          <div class="icon-item">
            <img src="images/icon-location.png" alt="Location" />
          </div>

          <div class="icon-item">
            <img src="images/icon-remote.png" alt="Remote" />
          </div>

          <div class="icon-item">
            <img src="images/icon-relocate.png" alt="Relocate" />
          </div>
        </div>
      </div>
    </div>

    <div class="right-column">
      <p>{{ i18n.translate('about.description1') }}</p>
      <p>{{ i18n.translate('about.description2') }}</p>

      <button class="outline-btn">{{ i18n.translate('about.cta') }}</button>
    </div>
  </div>
</section>
