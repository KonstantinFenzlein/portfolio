<section class="portfolio-section">

  <div class="header-content">
    <h2>{{ i18n.translate('work.title') }}</h2>
    <p class="subtitle">{{ i18n.translate('work.subtitle') }}</p>
  </div>

  <div class="projects-container">

    @for (project of projects; track project.title) {

      <div class="project-row">

        <div class="image-column">
          <div class="img-wrapper">
            <!-- Der blaue Blob im Hintergrund -->
            <div class="blob-bg"></div>
            <!-- Der Screenshot -->
            <img [src]="project.image" [alt]="project.title" class="project-img">
          </div>
        </div>

        <div class="text-column">
          <h3 class="project-title">{{ project.title }}</h3>
          <span class="tech-stack">{{ project.techStack }}</span>
          <p class="description">{{ i18n.currentLanguage() === 'DE' ? project.descriptionDE : project.descriptionEN }}</p>

          <a [href]="project.githubLink" target="_blank" class="outline-btn">
            GitHub
          </a>
        </div>

      </div>

    }

  </div>
</section>
