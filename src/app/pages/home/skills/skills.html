<section class="skills-section">

  <h2>{{ i18n.translate('skills.title') }}</h2>

  <div class="skills-grid">

    @for (skill of skills; track skill.name) {

      <div class="skill-item">
        <div class="icon-box">
          <img [src]="skill.icon" [alt]="skill.name">
        </div>
        <span>{{ skill.name }}</span>
      </div>

    }

  </div>
</section>
